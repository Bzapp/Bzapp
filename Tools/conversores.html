<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conversores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1512;--muted:#5e584f;--line:#e2d9cf;--panel:#f6f1ea;--red:#e10600;--red-dark:#c10500;--gold:#f0b429;--charcoal:#141416}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Manrope,Arial,Helvetica,sans-serif;color:var(--ink);background:#f3efe8;font-size:14px}
body{padding:10px 14px 20px}
.layout{max-width:1090px;margin:0 auto;display:grid;grid-template-columns:193px minmax(0,864px);gap:22px;align-items:start}
.sidebar{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff;box-shadow:0 6px 18px rgba(20,20,22,.05)}
.nav{display:flex;align-items:center;min-height:49px;padding:0 20px;border-bottom:1px solid var(--line);color:#3a342e;text-decoration:none;font-size:15px;cursor:pointer}
.nav:last-child{border-bottom:0}.nav.active{background:var(--red);color:#fff}.nav:hover:not(.active){background:#faf6f0}
.panel{width:100%;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff;box-shadow:0 6px 18px rgba(20,20,22,.05)}
.title{height:49px;display:flex;align-items:center;padding:0 21px;background:var(--charcoal);border-bottom:3px solid var(--gold);color:#fff;font-size:16px;font-family:Oswald,Arial Narrow,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.body{padding:25px 20px 19px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.lab{margin-bottom:12px;font-weight:700;color:#2c2621}.opts{display:flex;gap:19px;align-items:center;margin-bottom:26px;white-space:nowrap}.opt{display:flex;gap:8px;align-items:center}
input[type=radio]{appearance:none;width:16px;height:16px;border:1px solid #b7aea3;border-radius:50%;margin:0;background:#fff}
input[type=radio]:checked{border:5px solid var(--red)}
.row{display:flex;height:31px}.row input,.inp{width:100%;height:31px;border:1px solid #d2c8bc;border-radius:3px;padding:6px 9px;outline:none;background:#fff;color:var(--ink);font-size:14px}
.row input:focus,.inp:focus,.pressure-input:focus{border-color:var(--red);box-shadow:0 0 0 2px rgba(225,6,0,.15)}
.row input[readonly]{background:#f3eee7}.unit{width:70px;flex:0 0 70px;border:1px solid #d2c8bc;border-left:0;border-radius:0 3px 3px 0;background:#efe8de;display:flex;align-items:center;justify-content:center;font-size:12px;color:#5e584f}
.btn{display:flex;justify-content:flex-end;margin-top:16px}
button{border:0;border-radius:4px;background:var(--red);color:#fff;padding:10px 16px;font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}button:hover{background:var(--red-dark)}

/* Converter rows */
.conv-labels,.conv-fields{display:grid;gap:24px}
.conv-labels{margin-bottom:14px}.conv-fields{background:#f3eee7;padding:13px 12px 12px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}.c6{grid-template-columns:repeat(6,minmax(0,1fr))}.c7{grid-template-columns:repeat(7,minmax(0,1fr))}.c10{grid-template-columns:repeat(10,minmax(0,1fr))}
.conv-label{min-height:51px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;line-height:24px;white-space:nowrap}

/* Ensure the pressure converter is always horizontal like the reference */
.pressure-labels,.pressure-fields{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:24px}
.pressure-labels{margin-bottom:14px}.pressure-fields{background:#f3eee7;padding:13px 12px 12px}
.pressure-label{min-height:30px;display:flex;align-items:flex-end;justify-content:center;white-space:nowrap}
.pressure-input{width:100%;height:31px;border:1px solid #d2c8bc;border-radius:3px;padding:6px 8px;outline:none;font-size:14px;background:#fff}

@media(max-width:760px){
 body{padding:0 8px 12px}.layout{grid-template-columns:1fr;gap:14px}.sidebar{display:flex;overflow:auto}
 .nav{min-width:max-content;border-right:1px solid #ddd;border-bottom:0;padding:0 14px;font-size:14px}
 .nav:last-child{border-right:0}.grid3{grid-template-columns:1fr}.body{padding:20px 14px}
 .c6,.c7,.c10{grid-template-columns:repeat(2,1fr)}
 .pressure-labels,.pressure-fields{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="layout">
<nav class="sidebar" id="menu"></nav>
<main id="app"></main>
</div>

<script>
const menu=[
["flux","Fluxómetro"],["pressao","Pressão"],["par","Par"],["potencia","Potência"],["temperatura","Temperatura"],
["liquidos","Volume - Líquidos"],["cubico","Volume cúbico"],["comprimento","Comprimento"],["distancia","Distância"],["area","Área"],["peso","Peso"]
];

const data={
pressao:{
title:"Pressão",
units:[["bar","Bar"],["kgcm","Kg/cm"],["psi","Psi"],["hpa","hPa / mBar"],["kpa","kPa"],["mpa","MPa"],["mmhg","mmHg"]],
f:{bar:1,kgcm:1/1.01971621298,psi:1/14.503773773,hpa:1/1000,kpa:1/100,mpa:10,mmhg:1/750.061682704}
},
par:{title:"Par",units:[["lbft","Libras-pé|Lb/Ft"],["nm","Newton-metro|Nm"]],f:{lbft:1,nm:1/1.3558179483314}},
potencia:{title:"Potência",units:[["kw","kW"],["cv","CV"],["hp","hp"]],f:{kw:1,cv:.73549875,hp:.745699872}},
liquidos:{title:"Volume - Líquidos",units:[["ml","Mililitros|ml|(cc)"],["l","Litros|l"],["tsp","Teaspoon"],["tbsp","Tablespoon"],["oz","Onças|oz"],["cup","Cup"],["pint","Pintas"],["quart","Quartos"],["gal","Galões|gal"],["igal","Galões|imperiais|gal"]],f:{ml:1,l:1000,tsp:4.92892159375,tbsp:14.78676478125,oz:29.5735295625,cup:236.5882365,pint:473.176473,quart:946.352946,gal:3785.411784,igal:4546.09}},
cubico:{title:"Volume cúbico",units:[["mm3","Milímetro cúbico|mm³"],["cm3","Centímetro cúbico|cm³ - (cc)"],["in3","Polegada cúbica|in³"],["ft3","Pé cúbico|ft³"],["yd3","Jarda cúbica|yd³"],["m3","Metro cúbico|m³"]],f:{mm3:.000001,cm3:.0001,in3:.016387064,ft3:28.316846592,yd3:764.554857984,m3:1000}},
comprimento:{title:"Comprimento",units:[["nmi","Milha náutica|nmi"],["mile","Milha|mile"],["km","Quilómetros|km"],["m","Metros|m"],["yd","Yardas|yd"],["ft","Pés|ft"]],f:{nmi:1852,mile:1609.344,km:1000,m:1,yd:.9144,ft:.3048}},
distancia:{title:"Distância",units:[["nmi","Milhas náuticas|nmi"],["mile","Milhas|mile"],["km","Quilómetros|km"],["m","Metros|m"]],f:{nmi:1852,mile:1609.344,km:1000,m:1}},
area:{title:"Área",units:[["mm2","Milímetro|quadrado|mm²"],["cm2","Centímetro|quadrado|cm²"],["in2","Polegada|quadrada|in²"],["ft2","Pé|quadrado|ft²"],["yd2","Jarda|quadrada|yd²"],["m2","Metro|quadrado|m²"],["acre","acre"],["hectare","Hectare"],["km2","Quilómetro|quadrado|km²"],["mile2","Milha|quadrada|mile²"]],f:{mm2:.000001,cm2:.0001,in2:.00064516,ft2:.09290304,yd2:.83612736,m2:1,acre:4046.8564224,hectare:10000,km2:1000000,mile2:2589988.110336}},
peso:{title:"Peso",units:[["kg","Quilogramas|Kg"],["g","Gramas|g"],["mg","Miligramas|mg"],["oz","Onças|oz"],["lb","Libra|lb"],["ozt","Troy|Ounces|oz t"],["st","Stones|st"],["shortton","Tonelada|curta|ton"],["longton","Tonelada|longa|ton"],["metricton","Tonelada|métrica|ton"]],f:{kg:1,g:.001,mg:.000001,oz:.028349523125,lb:.45359237,ozt:.0311034768,st:6.35029318,shortton:907.18474,longton:1016.0469088,metricton:1000}}
};

function pnum(v){
 v=String(v).trim().replace(/\s/g,"");if(!v)return NaN;
 if(v.includes(",")&&v.includes("."))v=v.lastIndexOf(",")>v.lastIndexOf(".")?v.replace(/\./g,"").replace(",","."):v.replace(/,/g,"");
 else v=v.replace(",",".");
 return Number(v);
}
function fmt(v,d=2){return Number.isFinite(v)?v.toFixed(d).replace(".",","):""}

function flux(){
 return `<section class="panel"><div class="title">Fluxómetro</div><div class="body"><div class="grid3">
 <div><div class="lab">Combustível</div><div class="opts"><label class="opt"><input type="radio" name="fuel" value="gasolina" checked>Gasolina</label><label class="opt"><input type="radio" name="fuel" value="gasoleo">Gasóleo</label></div><div class="lab">Cilindrada</div><div class="row"><input id="cc"><div class="unit">ccm</div></div></div>
 <div><div class="lab">Alimentação</div><div class="opts"><label class="opt"><input type="radio" name="feed" value="atmosferico" checked>Atmosférico</label><label class="opt"><input type="radio" name="feed" value="turbo">Turbo</label></div><div class="lab">Marcha lenta</div><div class="row"><input id="idle" readonly><div class="unit" id="iu">mg/ciclo</div></div></div>
 <div><div class="lab">Unidades</div><div class="opts"><label class="opt"><input type="radio" name="fu" value="mg" checked>mg/ciclo</label><label class="opt"><input type="radio" name="fu" value="gs">g/s</label><label class="opt"><input type="radio" name="fu" value="kgh">kg/h</label></div><div class="lab">Carga completa</div><div class="row"><input id="full" readonly><div class="unit" id="fu">mg/ciclo</div></div></div>
 </div><div class="btn"><button onclick="calcFlux()">▣&nbsp; Calcular</button></div></div></section>`;
}

function generic(page){
 const d=data[page], n=d.units.length, cls=n===2?"c2":n===3?"c3":n===4?"c4":n===6?"c6":n===7?"c7":"c10";
 const labels=d.units.map(u=>`<div class="conv-label">${u[1].split("|").map(x=>`<span>${x}</span>`).join("")}</div>`).join("");
 const vals=d.units.map(u=>`<input class="inp" id="${page}-${u[0]}">`).join("");
 return `<section class="panel"><div class="title">${d.title}</div><div class="body"><div class="conv-labels ${cls}">${labels}</div><div class="conv-fields ${cls}">${vals}</div><div class="btn"><button onclick="calc('${page}')">▣&nbsp; Calcular</button></div></div></section>`;
}

function pressure(){
 const units=data.pressao.units;
 return `<section class="panel"><div class="title">Pressão</div><div class="body">
   <div class="pressure-labels">
     ${units.map(u=>`<div class="pressure-label">${u[1]}</div>`).join("")}
   </div>
   <div class="pressure-fields">
     ${units.map(u=>`<input class="pressure-input" id="pressao-${u[0]}" type="text" inputmode="decimal">`).join("")}
   </div>
   <div class="btn"><button onclick="calc('pressao')">▣&nbsp; Calcular</button></div>
 </div></section>`;
}

function temperature(){
 return genericTemp();
}
function genericTemp(){
 return `<section class="panel"><div class="title">Temperatura</div><div class="body">
 <div class="conv-labels c3"><div class="conv-label">Fahrenheit</div><div class="conv-label">Celsius</div><div class="conv-label">Kelvin</div></div>
 <div class="conv-fields c3"><input class="inp" id="temperatura-f"><input class="inp" id="temperatura-c"><input class="inp" id="temperatura-k"></div>
 <div class="btn"><button onclick="calcTemp()">▣&nbsp; Calcular</button></div></div></section>`;
}

function show(page){
 document.getElementById("app").innerHTML =
   page==="flux"?flux():page==="pressao"?pressure():page==="temperatura"?temperature():generic(page);
 document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.page===page));
}

function calc(page){
 const d=data[page], keys=Object.keys(d.f);let src=null,v=NaN;
 for(const k of keys){const n=pnum(document.getElementById(page+"-"+k).value);if(Number.isFinite(n)){src=k;v=n;break}}
 if(src===null)return;
 const base=v*d.f[src];
 keys.forEach(k=>document.getElementById(page+"-"+k).value=fmt(base/d.f[k]));
}

function calcTemp(){
 const f=pnum(document.getElementById("temperatura-f").value),c=pnum(document.getElementById("temperatura-c").value),k=pnum(document.getElementById("temperatura-k").value);
 if(Number.isFinite(f)){const cv=(f-32)*5/9;document.getElementById("temperatura-c").value=fmt(cv);document.getElementById("temperatura-k").value=fmt(cv+273.15)}
 else if(Number.isFinite(c)){document.getElementById("temperatura-f").value=fmt(c*9/5+32);document.getElementById("temperatura-k").value=fmt(c+273.15)}
 else if(Number.isFinite(k)){const cv=k-273.15;document.getElementById("temperatura-f").value=fmt(cv*9/5+32);document.getElementById("temperatura-c").value=fmt(cv)}
}

function calcFlux(){
  const cc = pnum(document.getElementById("cc").value);
  if(!Number.isFinite(cc) || cc <= 0) return;

  const fuel = document.querySelector('input[name="fuel"]:checked').value;
  const feed = document.querySelector('input[name="feed"]:checked').value;
  const unit = document.querySelector('input[name="fu"]:checked').value;

  /*
    Só dois pontos de operação: ralenti e plena carga.
    Base = mg/ciclo @ 1900 ccm; g/s e kg/h derivam dessa base.

    mg -> g/s:  g/s = mg/ciclo × ciclos_por_segundo / 1000
    g/s -> kg/h: kg/h = g/s × 3,6

    ciclos/s calibrados para reproduzir as referências originais.
  */

  const REF_CC = 1900;
  const REF = {
    gasolina_atmosferico: { idleMg: 114.0, fullMg: 570.0, idleHz: 80/3, fullHz: 150 },
    gasolina_turbo:       { idleMg: 114.0, fullMg: 1197.0, idleHz: 80/3, fullHz: 350/3 },
    gasoleo_atmosferico:  { idleMg: 285.0, fullMg: 684.0, idleHz: 80/3, fullHz: 100 },
    gasoleo_turbo:        { idleMg: 370.5, fullMg: 1140.0, idleHz: 80/3, fullHz: 100 }
  };

  const ref = REF[fuel + "_" + feed];
  if(!ref){
    document.getElementById("idle").value = "—";
    document.getElementById("full").value = "—";
    return;
  }

  const scale = cc / REF_CC;
  const idleMg = ref.idleMg * scale;
  const fullMg = ref.fullMg * scale;
  const idleGs = idleMg * ref.idleHz / 1000;
  const fullGs = fullMg * ref.fullHz / 1000;

  let idle, full, label, decimals;
  if(unit === "mg"){
    idle = idleMg; full = fullMg; label = "mg/ciclo"; decimals = 1;
  }else if(unit === "gs"){
    idle = idleGs; full = fullGs; label = "g/s"; decimals = 2;
  }else{
    idle = idleGs * 3.6; full = fullGs * 3.6; label = "kg/h"; decimals = 2;
  }

  document.getElementById("idle").value = idle.toFixed(decimals).replace(".",",");
  document.getElementById("full").value = full.toFixed(decimals).replace(".",",");
  document.getElementById("iu").textContent = label;
  document.getElementById("fu").textContent = label;
}

const menuEl=document.getElementById("menu");
menu.forEach(([id,label])=>{const a=document.createElement("a");a.className="nav";a.dataset.page=id;a.textContent=label;a.onclick=()=>show(id);menuEl.appendChild(a)});
show("flux");
</script>
</body>
</html>
